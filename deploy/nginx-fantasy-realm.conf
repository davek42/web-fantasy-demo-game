# Fantasy Realm — mounted under seaworthgames.com as /fantasy-realm/
#
# Source of truth for /etc/nginx/snippets/seaworth-extra-fantasy-realm.conf.
# Picked up by `include /etc/nginx/snippets/seaworth-extra-*.conf;` inside the
# 443 server block of sites-available/seaworth-games. Edit here, then copy to
# the host and reload nginx; never edit /etc directly (see DEPLOYMENT.md).
#
# Pure static site: no backend, no PM2 process, no API port.
#
# HEADERS: nginx *replaces* the inherited add_header set in any location that
# declares its own add_header, so every site-wide header must be repeated in
# BOTH blocks below. Paste the site's full add_header list (HSTS, X-Frame-
# Options, Referrer-Policy, ...) from sites-available/seaworth-games where the
# markers say so, keeping the CSP line from this file: the site-wide
# `script-src 'none'` would blank the game.

# hashed build assets: cache forever
location ^~ /fantasy-realm/assets/ {
    alias /var/www/fantasy-realm/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    # --- paste the site-wide add_header lines here (every one of them) ---
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}

# the game itself: a single index.html, no client-side routes
location ^~ /fantasy-realm/ {
    alias /var/www/fantasy-realm/;
    index index.html;
    try_files $uri $uri/ =404;
    # --- paste the site-wide add_header lines here (every one of them) ---
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}
